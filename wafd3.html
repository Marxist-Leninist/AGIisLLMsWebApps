<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matter-Physical Soliton Warp Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #0f0; font-family: monospace; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 1px solid #0f0;
            pointer-events: none;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Lentz Soliton Drive (Positive Matter-Physical)</h3>
        <p id="status">Status: Standby</p>
        <p id="distance">Distance: 0 Mly</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 150, 300);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1.5, 1000);
        pointLight.position.set(50, 50, 50);
        scene.add(pointLight);

        // 1. Create Earth (Procedural Colors)
        const earthGeometry = new THREE.SphereGeometry(10, 32, 32);
        const earthMaterial = new THREE.MeshPhongMaterial({ color: 0x2233ff, emissive: 0x112244, wireframe: true });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earth.position.set(-200, 0, 0);
        scene.add(earth);

        // 2. Create Andromeda (Particle System)
        const andromedaParticles = new THREE.BufferGeometry();
        const particleCount = 5000;
        const posArray = new Float32Array(particleCount * 3);
        for(let i=0; i < particleCount * 3; i+=3) {
            const radius = Math.random() * 40;
            const angle = Math.random() * Math.PI * 2;
            posArray[i] = Math.cos(angle) * radius + (Math.random() - 0.5) * 10;
            posArray[i+1] = (Math.random() - 0.5) * 5;
            posArray[i+2] = Math.sin(angle) * radius + (Math.random() - 0.5) * 10;
        }
        andromedaParticles.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMaterial = new THREE.PointsMaterial({ size: 0.5, color: 0xffaa00, transparent: true, opacity: 0.8 });
        const andromeda = new THREE.Points(andromedaParticles, particleMaterial);
        andromeda.position.set(300, 0, 0);
        andromeda.rotation.x = Math.PI / 6;
        scene.add(andromeda);

        // 3. Create Ship & Warp Soliton Bubble
        const shipGroup = new THREE.Group();
        shipGroup.position.copy(earth.position);
        
        // The Ship itself
        const shipGeo = new THREE.ConeGeometry(2, 8, 16);
        shipGeo.rotateZ(-Math.PI / 2);
        const shipMat = new THREE.MeshPhongMaterial({ color: 0xdddddd });
        const ship = new THREE.Mesh(shipGeo, shipMat);
        shipGroup.add(ship);

        // The Solitonic Warp Bubble (Topology visualization)
        const bubbleGeo = new THREE.TorusGeometry(6, 2, 16, 100);
        const bubbleMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffcc, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.0 
        });
        const warpBubble = new THREE.Mesh(bubbleGeo, bubbleMat);
        warpBubble.rotation.y = Math.PI / 2;
        shipGroup.add(warpBubble);
        scene.add(shipGroup);

        // Background Stars
        const starGeo = new THREE.BufferGeometry();
        const starArray = new Float32Array(2000 * 3);
        for(let i=0; i<6000; i++) {
            starArray[i] = (Math.random() - 0.5) * 1000;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starArray, 3));
        const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.7});
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // Animation State Machine
        let phase = 0; // 0: Idle, 1: Spooling, 2: Transit, 3: Venting/Decelerating, 4: Arrived
        let progress = 0;
        const totalDistance = earth.position.distanceTo(andromeda.position);
        const statusEl = document.getElementById('status');
        const distEl = document.getElementById('distance');

        // Camera tracking offset
        const cameraOffset = new THREE.Vector3(-40, 20, 40);

        function animate() {
            requestAnimationFrame(animate);

            // Rotate celestial bodies
            earth.rotation.y += 0.005;
            andromeda.rotation.y += 0.002;
            stars.rotation.y -= 0.0001;

            if (phase === 0) {
                setTimeout(() => { phase = 1; }, 2000);
            } 
            else if (phase === 1) {
                statusEl.innerText = "Status: Configuring matter-physical soliton topology...";
                warpBubble.opacity += 0.01;
                warpBubble.rotation.x += 0.05;
                if (warpBubble.opacity >= 0.8) phase = 2;
            } 
            else if (phase === 2) {
                statusEl.innerText = "Status: Superluminal Transit. Stress-tensor stable.";
                warpBubble.rotation.x += 0.1;
                progress += 0.002; // Speed
                
                // Move ship
                shipGroup.position.lerpVectors(earth.position, andromeda.position, progress);
                
                // Update UI (simulating 2.5 million light years)
                let mly = (progress * 2.5).toFixed(2);
                distEl.innerText = `Distance: ${mly} Mly`;

                // Begin safe deceleration sequence before arrival to prevent physical blueshift wave
                if (progress > 0.85) phase = 3;
            } 
            else if (phase === 3) {
                statusEl.innerText = "Status: Safe dispersal of accumulated physical particles...";
                warpBubble.rotation.x += 0.02;
                warpBubble.scale.set(1 + progress*2, 1 + progress*2, 1 + progress*2); // Expand bubble to shed matter safely
                warpBubble.opacity -= 0.01;
                progress += 0.001; // Slow down
                shipGroup.position.lerpVectors(earth.position, andromeda.position, progress);
                
                let mly = (progress * 2.5).toFixed(2);
                distEl.innerText = `Distance: ${mly} Mly`;

                if (warpBubble.opacity <= 0 || progress >= 0.98) {
                    phase = 4;
                    warpBubble.opacity = 0;
                }
            } 
            else if (phase === 4) {
                statusEl.innerText = "Status: Arrived at Andromeda safely. Topology neutralized.";
                shipGroup.position.lerpVectors(earth.position, andromeda.position, 0.98); // Final parking orbit
                distEl.innerText = `Distance: 2.50 Mly`;
            }

            // Keep camera following the ship
            camera.position.copy(shipGroup.position).add(cameraOffset);
            camera.lookAt(shipGroup.position);

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        animate();
    </script>
</body>
</html>
